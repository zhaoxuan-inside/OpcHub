# OpcHub 全局统一定义词典与防歧义词典 (_02_project_word.dict.yaml)
# Version: 1.1.0
# Complies with hs-dev-skill verify_consistency schema

terms:
  - term: "创客"
    en_name: "Maker"
    description: "平台的核心服务主体，一人公司（One-Person Company）创办者或独立开发者"
    forbidden_alias: ["end_user", "consumer", "client_person"]

  - term: "收费权益"
    en_name: "Entitlement"
    description: "用户账户强绑定的功能与服务调用权限凭据，用于门禁鉴权与按量计费"
    forbidden_alias: ["vip_flag", "permission_ticket", "reward_point"]

  - term: "扶持政策"
    en_name: "Policy"
    description: "政府公开的免税、算力券、研发费用加计扣除等扶持补贴条目"
    forbidden_alias: ["government_order", "subsidy_doc"]

  - term: "生态特权"
    en_name: "Perk"
    description: "云厂商、大模型平台、离岸支付工具提供给创客的专属额度与折扣"
    forbidden_alias: ["welfare_pack", "coupon_gift"]

  - term: "需求委托"
    en_name: "Demand"
    description: "企业客户发布的技术外包、合规辅导或定制开发需求"
    forbidden_alias: ["work_order", "gig_item"]

  - term: "微内核编排链路"
    en_name: "DAGPipeline"
    description: "后端通过有向无环图串联门禁、算子与存储的执行拓扑流程"
    forbidden_alias: ["script_chain", "raw_workflow"]

  - term: "论坛讨论帖"
    en_name: "ForumThread"
    description: "创客交流贴吧中发布的实战经验、踩坑记录或出海商业主题帖"
    forbidden_alias: ["main_post", "topic_entity", "article_item"]

  - term: "多级问答回复"
    en_name: "ForumComment"
    description: "对讨论帖的回答或对回答的楼中楼二级/多级嵌套回复（基于物化路径模型）"
    forbidden_alias: ["reply_entity", "sub_talk", "talk_item"]

  - term: "认同点赞"
    en_name: "Upvote"
    description: "对帖子或问答回复的投票认同机制，一人一票防重"
    forbidden_alias: ["like_action", "thumb_up", "agree_vote"]

  - term: "收藏归档"
    en_name: "Bookmark"
    description: "创客将优质实战经验或出海指南加入个人收藏夹"
    forbidden_alias: ["favorite_mark", "star_item"]

lifecycle_terms:
  - concept: "DAG Pipeline Lifecycle"
    command: "execute_pipeline"
    event: "pipeline.executed"
    status: "SUCCESS"
    forbidden_alias: ["run_pipe", "pipeline_ran"]

  - concept: "Entitlement Lifecycle"
    command: "grant_entitlement"
    event: "entitlement.activated"
    status: "ACTIVE"
    forbidden_alias: ["open_vip", "vip_opened"]

  - concept: "Document Generation Lifecycle"
    command: "generate_document"
    event: "document.generated"
    status: "READY"
    forbidden_alias: ["create_doc", "doc_created"]

  - concept: "Forum Post Lifecycle"
    command: "publish_post"
    event: "post.published"
    status: "PUBLISHED"
    forbidden_alias: ["send_msg", "msg_sent"]

  - concept: "Forum Comment Lifecycle"
    command: "reply_comment"
    event: "comment.created"
    status: "ACTIVE"
    forbidden_alias: ["post_reply", "reply_posted"]

  - concept: "Upvote Lifecycle"
    command: "toggle_upvote"
    event: "target.upvoted"
    status: "UPVOTED"
    forbidden_alias: ["give_like", "like_given"]

  - concept: "Bookmark Lifecycle"
    command: "toggle_bookmark"
    event: "thread.bookmarked"
    status: "BOOKMARKED"
    forbidden_alias: ["do_favorite", "fav_done"]
