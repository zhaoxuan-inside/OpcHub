# ==============================================================================
# OpcHub Unified Inbound Gateway Scenario Routing & Version Governance Config
# Defines all scenarios, code versions, domain mappings, and legacy request handling.
# Zero hardcoding in application code: all dispatching is driven by this file.
# ==============================================================================
gateway:
  default_version: "v1.0.0"

  # ----------------------------------------------------------------------------
  # Version Governance & Lifecycle Policy
  # Defines how old / unknown versions are handled when new versions are released
  # ----------------------------------------------------------------------------
  version_policy:
    unknown_version_strategy: "fallback_to_default"  # options: fallback_to_default | reject

    # Sunset / EOL Versions: requests with these versions in body are cleanly rejected with upgrade instructions
    sunset_versions:
      "v0.8.0":
        code: 426
        min_supported_version: "v1.0.0"
        message: "客户端代码版本 v0.8.0 已停运下线，系统支持的最低版本为 v1.0.0，请升级客户端。"
      "v0.8.1":
        code: 426
        min_supported_version: "v1.0.0"
        message: "客户端代码版本 v0.8.1 已停运下线，系统支持的最低版本为 v1.0.0，请升级客户端。"

    # Deprecated Versions: still serviced, but warning notice is returned in metadata/context
    deprecated_versions:
      "v0.9.0":
        message: "代码版本 v0.9.0 即将终止服务，建议升级至 v1.0.0 或更高版本。"
      "v0.9.5":
        message: "代码版本 v0.9.5 即将终止服务，建议升级至 v1.0.0 或更高版本。"

  # ----------------------------------------------------------------------------
  # Scenario Route Rules
  # Each scenario can have multiple versions coexisting simultaneously.
  # ----------------------------------------------------------------------------
  routes:
    # --------------------------------------------------------------------------
    # 1. Product Showcase (商业作品)
    # --------------------------------------------------------------------------
    - scenario: "products.list"
      version: "v1.0.0"
      domain: "products"
      description: "检索独立创客商业作品列表"
      is_default: true
      handler: "src.domains.products.service.product_service:list_products"
      args_type: "kwargs"

    - scenario: "products.publish"
      version: "v1.0.0"
      domain: "products"
      description: "发布新独立创客作品至橱窗（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:product_publish_adapter"
      required_permission: "content:publish"

    - scenario: "products.search.semantic"
      version: "v1.0.0"
      domain: "products"
      description: "基于轻量向量引擎与余弦相似度检索独立商业作品库 (NLP 语义搜索)"
      is_default: true
      handler: "src.core.gateway.adapters:product_semantic_search_adapter"

    # --------------------------------------------------------------------------
    # 2. Policy Center (政策中心)
    # --------------------------------------------------------------------------
    - scenario: "policies.list"
      version: "v1.0.0"
      domain: "policies"
      description: "获取政府扶持与税收减免政策列表"
      is_default: true
      handler: "src.domains.policies.service.policy_service:list_policies"
      args_type: "kwargs"

    - scenario: "policies.publish"
      version: "v1.0.0"
      domain: "policies"
      description: "发布政策公文（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:policy_publish_adapter"
      required_permission: "content:publish"

    - scenario: "policies.match"
      version: "v1.0.0"
      domain: "policies"
      description: "测算创客免税资格与预计减免额 (微内核 DAG 编排驱动)"
      is_default: true
      handler: "src.core.gateway.adapters:policy_match_adapter"

    # --------------------------------------------------------------------------
    # 3. Demands & Bidding (需求集市与竞标)
    # --------------------------------------------------------------------------
    - scenario: "demands.list"
      version: "v1.0.0"
      domain: "demands"
      description: "检索企业委托寻源商机列表"
      is_default: true
      handler: "src.domains.demands.service.demand_service:list_demands"
      args_type: "kwargs"

    - scenario: "demands.publish"
      version: "v1.0.0"
      domain: "demands"
      description: "微内核DAG编排：发布企业外包委托与法律求助（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:demand_publish_adapter"
      required_permission: "content:publish"

    - scenario: "demands.bid"
      version: "v1.0.0"
      domain: "demands"
      description: "微内核DAG编排：提交创客竞标方案与撮合"
      is_default: true
      handler: "src.core.gateway.adapters:demand_bid_adapter"
      required_permission: "market:vendor_apply"


    # --------------------------------------------------------------------------
    # 4. SOP & Compliance Documents (合规文书与流程模板)
    # --------------------------------------------------------------------------
    - scenario: "sop.templates"
      version: "v1.0.0"
      domain: "sop"
      description: "获取合规流程阶段与文档模板列表"
      is_default: true
      handler: "src.domains.sop.service.sop_service:get_stages_and_templates"

    - scenario: "sop.documents"
      version: "v1.0.0"
      domain: "sop"
      description: "获取标准文书库列表（含作者、来源机构、喜欢/收藏/真实使用数）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_document_catalog_adapter"

    - scenario: "sop.flow.templates"
      version: "v1.0.0"
      domain: "sop"
      description: "获取平台流程模板库列表（含作者、来源机构、喜欢/收藏/使用数）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_template_catalog_adapter"

    - scenario: "sop.flow.template.detail"
      version: "v1.0.0"
      domain: "sop"
      description: "获取单个平台流程模板及其展开后的文书步骤"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_template_detail_adapter"
      args_type: "key"
      key_name: "flow_id"





    - scenario: "sop.graph"
      version: "v1.0.0"
      domain: "sop"
      description: "获取完整合规流程图谱：阶段、节点(文书/子图)、依赖边与目标反查索引"
      is_default: true
      handler: "src.domains.sop.service.sop_service:get_graph"

    - scenario: "sop.node"
      version: "v1.0.0"
      domain: "sop"
      description: "获取单个流程节点上下文：子文档、前置依赖与本步产出说明"
      is_default: true
      handler: "src.core.gateway.adapters:sop_node_context_adapter"
      args_type: "key"
      key_name: "node_id"

    - scenario: "sop.flow.list"
      version: "v1.0.0"
      domain: "sop"
      description: "获取创客自建的流程清单"
      is_default: true
      handler: "src.domains.sop.service.sop_service:list_flows"
      args_type: "kwargs"

    - scenario: "sop.myflow.cards"
      version: "v1.0.0"
      domain: "sop"
      description: "获取创客私有流程卡片列表（与平台流程卡片同构）"
      is_default: true
      handler: "src.domains.sop.service.sop_service:list_my_flow_cards"
      args_type: "kwargs"

    - scenario: "sop.flow.get"
      version: "v1.0.0"
      domain: "sop"
      description: "获取单个自建流程及其展开后的文书清单"
      is_default: true
      handler: "src.domains.sop.service.sop_service:resolve_flow"
      args_type: "key"
      key_name: "flow_id"

    - scenario: "sop.flow.create"
      version: "v1.0.0"
      domain: "sop"
      description: "创建并持久化一条创客自建流程"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_create_adapter"
      required_permission: "sop:save_progress"

    - scenario: "sop.flow.update"
      version: "v1.0.0"
      domain: "sop"
      description: "更新一条创客自建流程"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_update_adapter"
      required_permission: "sop:save_progress"

    - scenario: "sop.flow.delete"
      version: "v1.0.0"
      domain: "sop"
      description: "删除一条创客自建流程"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_delete_adapter"
      required_permission: "sop:save_progress"
      args_type: "key"
      key_name: "flow_id"

    - scenario: "sop.template.publish"
      version: "v1.0.0"
      domain: "sop"
      description: "发布并登记新合规文书模板"
      is_default: true
      handler: "src.domains.sop.service.sop_service:create_template"
      required_permission: "data:schema_manage"
      model: "src.domains.sop.models:SOPTemplateCreate"

    - scenario: "sop.document.render"
      version: "v1.0.0"
      domain: "sop"
      description: "微内核DAG编排：根据用户输入渲染并持久化合规文书"
      is_default: true
      handler: "src.core.gateway.adapters:sop_document_render_adapter"
      required_permission: "sop:save_progress"

    - scenario: "sop.document.draft"
      version: "v1.0.0"
      domain: "sop"
      description: "文本编辑器起草：保存自由编辑的私有文书草稿（可选基于标准模板，注册创客可用）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_document_draft_adapter"
      required_permission: "content:publish"


    - scenario: "sop.document.get"
      version: "v1.0.0"
      domain: "sop"
      description: "按 ID 获取已生成的文书实例"
      is_default: true
      handler: "src.domains.sop.service.sop_service:get_document"
      args_type: "key"
      key_name: "doc_id"

    - scenario: "sop.document.list"
      version: "v1.0.0"
      domain: "sop"
      description: "获取创客已保存的文书历史列表"
      is_default: true
      handler: "src.domains.sop.service.sop_service:list_documents"
      args_type: "kwargs"

    - scenario: "sop.document.delete"
      version: "v1.0.0"
      domain: "sop"
      description: "删除一条创客已保存的文书实例"
      is_default: true
      handler: "src.domains.sop.service.sop_service:delete_document"
      args_type: "key"
      key_name: "doc_id"
      required_permission: "sop:save_progress"

    - scenario: "sop.document.publish"
      version: "v1.0.0"
      domain: "sop"
      description: "发布「我的文书」至审核队列（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_document_publish_adapter"
      required_permission: "content:publish"

    - scenario: "sop.flow.publish"
      version: "v1.0.0"
      domain: "sop"
      description: "发布「我的流程」至审核队列（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_flow_publish_adapter"
      required_permission: "content:publish"

    - scenario: "sop.review.queue"
      version: "v1.0.0"
      domain: "sop"
      description: "获取文书与流程发布审核队列（含合法性/合规性/敏感词审核状态）"
      is_default: true
      handler: "src.core.gateway.adapters:sop_review_queue_adapter"
      required_permission: "review:audit_all"

    - scenario: "sop.review.process"
      version: "v1.0.0"
      domain: "sop"
      description: "消费审核队列：逐项检查合法性/合规性/敏感词，通过后发布至标准文书与流程向导"
      is_default: true
      handler: "src.core.gateway.adapters:sop_review_process_adapter"
      required_permission: "review:audit_all"

    # --------------------------------------------------------------------------
    # 5. Perks & Infrastructure (基础设施与福利)
    # --------------------------------------------------------------------------
    - scenario: "perks.list"
      version: "v1.0.0"
      domain: "perks"
      description: "获取生态优惠公告列表（Token 优惠 / 服务器优惠 / SaaS 服务优惠等，支持按分类过滤）"
      is_default: true
      handler: "src.domains.perks.service.perk_service:list_perks"

    - scenario: "perks.publish"
      version: "v1.0.0"
      domain: "perks"
      description: "提报并上线生态优惠公告（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:perk_publish_adapter"
      required_permission: "content:publish"

    - scenario: "perks.claim"
      version: "v1.0.0"
      domain: "perks"
      description: "微内核DAG编排：领取特权并生成专属兑换凭据"
      is_default: true
      handler: "src.core.gateway.adapters:perk_claim_adapter"
      required_permission: "perk:claim_coupon"


    # --------------------------------------------------------------------------
    # 6. Forum & Brainstorm (头脑风暴社区)
    # --------------------------------------------------------------------------
    - scenario: "forum.feed.stream"
      version: "v1.0.0"
      domain: "forum"
      description: "流式无限滚动检索头脑风暴社区讨论帖 (微内核 DAG + 缓存 + 预加载驱动)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_feed_stream_adapter"

    - scenario: "forum.threads.list"
      version: "v1.0.0"
      domain: "forum"
      description: "检索头脑风暴社区讨论帖列表 (分页约束: id, page, page_size/page_length)"
      is_default: true
      handler: "src.domains.forum.service.forum_service:list_threads_paginated"
      args_type: "kwargs"

    - scenario: "forum.threads.publish"
      version: "v1.0.0"
      domain: "forum"
      description: "发布新创客讨论帖与踩坑复盘（所有注册用户可发布，管理员发布自动打官方标签）"
      is_default: true
      handler: "src.core.gateway.adapters:forum_thread_publish_adapter"
      required_permission: "content:publish"

    - scenario: "forum.threads.get"
      version: "v1.0.0"
      domain: "forum"
      description: "获取议题详情、知乎式观点回答与物化路径评论树"
      is_default: true
      handler: "src.core.gateway.adapters:forum_thread_get_adapter"

    - scenario: "forum.answers.publish"
      version: "v1.0.0"
      domain: "forum"
      description: "撰写并发布针对议题的知乎式深度观点回答 (微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_answer_publish_adapter"
      required_permission: "content:publish"

    - scenario: "forum.answers.accept"
      version: "v1.0.0"
      domain: "forum"
      description: "提问者采纳最佳观点或取消采纳 (微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_answer_accept_adapter"
      required_permission: "forum:post_comment"

    - scenario: "forum.vote"
      version: "v1.0.0"
      domain: "forum"
      description: "知乎式互斥赞同 / 反对 / 取消投票 (微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_vote_adapter"
      required_permission: "forum:post_comment"

    - scenario: "forum.threads.follow"
      version: "v1.0.0"
      domain: "forum"
      description: "关注/取消关注议题"
      is_default: true
      handler: "src.core.gateway.adapters:forum_follow_adapter"
      required_permission: "forum:post_comment"

    - scenario: "forum.comments.create"
      version: "v1.0.0"
      domain: "forum"
      description: "发表一级回答或物化路径嵌套子回复"
      is_default: true
      handler: "src.core.gateway.adapters:forum_comment_adapter"
      required_permission: "forum:post_comment"

    - scenario: "forum.threads.update"
      version: "v1.0.0"
      domain: "forum"
      description: "编辑头脑风暴讨论帖标题/正文/分区 (限作者或管理员，微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_thread_update_adapter"
      required_permission: "content:publish"
      owner_check:
        resource_type: "thread"
        id_field: "thread_id"

    - scenario: "forum.answers.delete"
      version: "v1.0.0"
      domain: "forum"
      description: "删除观点回答及其评论与投票 (限回答作者或管理员，微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_answer_delete_adapter"
      required_permission: "forum:post_comment"
      owner_check:
        resource_type: "answer"
        id_field: "answer_id"

    - scenario: "forum.comments.delete"
      version: "v1.0.0"
      domain: "forum"
      description: "删除评论及其子评论树与投票 (限评论作者或管理员，微内核 DAG 编排)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_comment_delete_adapter"
      required_permission: "forum:post_comment"
      owner_check:
        resource_type: "comment"
        id_field: "comment_id"

    - scenario: "forum.threads.delete"
      version: "v1.0.0"
      domain: "forum"
      description: "删除头脑风暴社区讨论帖 (限超级管理员或帖子发帖人)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_thread_delete_adapter"
      required_permission: "forum:post_comment"
      owner_check:
        resource_type: "thread"
        id_field: "thread_id"

    - scenario: "forum.search.semantic"
      version: "v1.0.0"
      domain: "forum"
      description: "基于轻量向量引擎与余弦相似度检索头脑风暴社区讨论帖 (NLP 语义搜索)"
      is_default: true
      handler: "src.core.gateway.adapters:forum_semantic_search_adapter"

    # --------------------------------------------------------------------------
    # 6.5 Unified Content Interactions (统一公开内容互动)
    # --------------------------------------------------------------------------
    - scenario: "content.interaction.toggle"
      version: "v1.0.0"
      domain: "interactions"
      description: "统一切换公开内容互动：点赞 LIKE / 收藏 FAVORITE / 喜欢 LOVE / 踩 DISLIKE"
      is_default: true
      handler: "src.core.gateway.adapters:content_interaction_toggle_adapter"
      required_permission: "content:interact"

    - scenario: "content.interaction.rate"
      version: "v1.0.0"
      domain: "interactions"
      description: "对公开内容进行 1-5 星打分（可重复打分覆盖）"
      is_default: true
      handler: "src.core.gateway.adapters:content_interaction_rate_adapter"
      required_permission: "content:interact"

    - scenario: "content.interactions.state"
      version: "v1.0.0"
      domain: "interactions"
      description: "批量读取公开内容的互动计数与当前登录用户的互动状态"
      is_default: true
      handler: "src.core.gateway.adapters:content_interactions_state_adapter"

    - scenario: "content.interactions.mine"
      version: "v1.0.0"
      domain: "interactions"
      description: "读取当前创客的点赞、收藏、喜欢与评论记录"
      is_default: true
      handler: "src.core.gateway.adapters:content_interactions_mine_adapter"

    - scenario: "content.comments.list"
      version: "v1.0.0"
      domain: "interactions"
      description: "读取公开内容的评论列表"
      is_default: true
      handler: "src.core.gateway.adapters:content_comments_list_adapter"

    - scenario: "content.comments.create"
      version: "v1.0.0"
      domain: "interactions"
      description: "对公开内容发表评论"
      is_default: true
      handler: "src.core.gateway.adapters:content_comments_create_adapter"
      required_permission: "content:comment"

    - scenario: "content.comments.delete"
      version: "v1.0.0"
      domain: "interactions"
      description: "删除自己发表的公开内容评论"
      is_default: true
      handler: "src.core.gateway.adapters:content_comments_delete_adapter"
      required_permission: "content:comment"

    # --------------------------------------------------------------------------
    # 7. Telemetry & Platform Overview (运营大盘与全景)
    # --------------------------------------------------------------------------
    - scenario: "telemetry.dashboard"
      version: "v1.0.0"
      domain: "telemetry"
      description: "全域运营大盘实时核心指标聚合 (由微内核 DAG OPC_OPS_DASHBOARD_PIPELINE 驱动)"
      is_default: true
      handler: "src.core.gateway.adapters:ops_dashboard_adapter"
      required_permission: "review:audit_all"

    - scenario: "ops.dashboard"
      version: "v1.0.0"
      domain: "telemetry"
      description: "运营大盘三端指标检索别名 (由微内核 DAG OPC_OPS_DASHBOARD_PIPELINE 驱动)"
      is_default: true
      handler: "src.core.gateway.adapters:ops_dashboard_adapter"
      required_permission: "review:audit_all"

    - scenario: "home.overview"
      version: "v1.0.0"
      domain: "home"
      description: "首页全域宏观指标聚合与功能空间地图 (由微内核 DAG OPC_HOME_OVERVIEW_PIPELINE 驱动)"
      is_default: true
      handler: "src.core.gateway.adapters:home_overview_adapter"

    # --------------------------------------------------------------------------
    # 8. User Profile & Entitlements (创客档案与权益)
    # --------------------------------------------------------------------------
    - scenario: "user.profile"
      version: "v1.0.0"
      domain: "user"
      description: "获取创客个人主体档案与已激活权益 (由微内核 DAG OPC_USER_PROFILE_PIPELINE 驱动)"
      is_default: true
