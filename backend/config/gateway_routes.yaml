    - scenario: "auth.password-strength"
      version: "v1.0.0"
      domain: "auth"
      description: "评估密码复杂度、熵值与商用安全合规评级"
      is_default: true
      handler: "src.core.gateway.adapters:auth_password_strength_adapter"

    - scenario: "auth.legal-agreements"
      version: "v1.0.0"
