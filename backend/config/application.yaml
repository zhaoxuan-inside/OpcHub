# ==============================================================================
# OpcHub Platform Application Configuration
# All configurations are loaded dynamically from this file, zero hardcoding in code.
# ==============================================================================
app:
  name: "OpcHub Microkernel Platform"
  version: "v1.0.4-live"
  environment: "development"
  debug: true
  api_prefix: "/api/v1"
  docs_url: "/docs"
  redoc_url: "/redoc"
  console_html_path: "hs_dev_docs/_02_feature_spec/_03_prototype_html/opchub_all_pages_demo.html"
  cors_origins:
    - "*"

server:
  host: "0.0.0.0"
  port: 8000
  reload: true

gateway:
  # Inbound Unified Gateway Endpoints
  endpoints:
    - "/api/welcom/opc_world"
    - "/api/welcome/opc_world"
    - "/api/v1/dispatch"
    - "/api/v1/gateway/dispatch"
  
  # Metadata & Rules Introspection Endpoints
  metadata_endpoints:
    - "/api/welcom/opc_world/rules"
    - "/api/welcome/opc_world/rules"
    - "/api/v1/gateway/rules"

  # Path to external scenario routing & version governance configuration
  routes_config_file: "config/gateway_routes.yaml"
