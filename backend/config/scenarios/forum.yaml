      - id: query
        operator: calc.forum.query
        inputs:
          category_code: $inputs.category_code
          search: $inputs.search
          sort_by: $inputs.sort_by
          cursor: $inputs.cursor
          limit: $inputs.limit
      - id: list
        operator: entity.list
        params: {entity: forum.thread}
        inputs:
          filters: $nodes.query.filters
          search: $nodes.query.search
          order: $nodes.query.order
      - id: page
        operator: calc.forum.page
        inputs:
          items: $nodes.list.items
          mode: $nodes.query.mode
          category_code: $nodes.query.category_code
          sort_by: $nodes.query.sort_by
          cursor: $nodes.query.cursor
          limit: $nodes.query.limit
      - id: answers
        operator: entity.list
        params: {entity: forum.answer}
      - id: votes
        operator: entity.list
        params: {entity: forum.vote}
        inputs:
          filters: {user_id: "$nodes.viewer.viewer_id"}
      - id: follows
        operator: entity.list
        params: {entity: forum.follow}
        inputs:
          filters: {user_id: "$nodes.viewer.viewer_id"}
      - id: assemble
        operator: assemble.forum.feed
        params: {output_key: feed}
        inputs:
          envelope: $nodes.page.envelope
          answers: $nodes.answers.items
          votes: $nodes.votes.items
          follows: $nodes.follows.items
          viewer_id: $nodes.viewer.viewer_id
      - id: envelope
        operator: transform.merge
        params:
