# 运营大盘（Telemetry / Ops Dashboard）业务编排资产
# 业务 = 算子编排；算子只做单件事，业务规则由本文件声明。
#
# 边界：
# * 各域记录数由通用 `entity.count` / `entity.list` 节点收集，实体名以字符串配置；
#   本场景不 import 任何领域 service。
# * 聚合只做纯函数装配：`assemble.telemetry.dashboard`
#   （src/domains/telemetry/functions.py），无 I/O、无跨域调用。
# * 无埋点数据源的 KPI（UV/PV/MAU/留存/吞吐）返回 0，不伪造流量。

scenarios:
  - scenario: OPC_OPS_DASHBOARD_PIPELINE
    version: v1.0.0
    domain: telemetry
    description: 全域运营大盘实时核心指标聚合（实体计数 + 纯函数装配）
    saga: false
    nodes:
      - id: gate
        operator: guard.permission
        params: {permission: "review:audit_all", message: "权限不足：运营大盘仅限平台审计管理员查看"}

      - id: count_policy
        operator: entity.count
        params: {entity: policy.item}
      - id: count_sop
        operator: entity.count
        params: {entity: sop.template}
      - id: count_forum
        operator: entity.count
        params: {entity: forum.thread}
      - id: count_demand
        operator: entity.count
        params: {entity: demands.item}
      - id: count_product
        operator: entity.count
        params: {entity: product.item}
      - id: count_perk
        operator: entity.count
        params: {entity: perk.item}
      - id: count_compliance
        operator: entity.count
        params:
          entity: compliance.item
          filters: {kind: law}
      - id: list_interactions
        operator: entity.list
        params:
          entity: interaction.record
          query: {limit: 0}

      - id: assemble
        operator: assemble.telemetry.dashboard
        inputs:
          time_range: $inputs.time_range
          terminal_filter: $inputs.terminal_filter
          policy_count: $nodes.count_policy.total
          sop_count: $nodes.count_sop.total
          forum_count: $nodes.count_forum.total
          demand_count: $nodes.count_demand.total
          product_count: $nodes.count_product.total
          perk_count: $nodes.count_perk.total
          compliance_count: $nodes.count_compliance.total
          interaction_records: $nodes.list_interactions.items
      - id: response
        operator: response.build
        params: {source: dashboard}
        inputs:
          dashboard: $nodes.assemble
    edges:
      - [gate, count_policy]
      - [gate, count_sop]
      - [gate, count_forum]
      - [gate, count_demand]
      - [gate, count_product]
      - [gate, count_perk]
      - [gate, count_compliance]
      - [gate, list_interactions]
      - [count_policy, assemble]
      - [count_sop, assemble]
      - [count_forum, assemble]
      - [count_demand, assemble]
      - [count_product, assemble]
      - [count_perk, assemble]
      - [count_compliance, assemble]
      - [list_interactions, assemble]
      - [assemble, response]
