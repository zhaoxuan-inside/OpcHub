# 平台治理域场景资产（MicroFlow4Python）。
# 治理写操作统一经 OPC_PLATFORM_GOVERNANCE_PIPELINE 元管线执行（guard →
# persist → telemetry），与 OPC_ORCHESTRATION_CATALOG_PIPELINE 同构；
# 载荷走 {action, payload} 信封。读场景直连 handler（框架约定）。
scenarios:
  - scenario: OPC_PLATFORM_GOVERNANCE_PIPELINE
    version: v1.0.0
    domain: platform
    description: 平台治理写操作元流水线（guard -> persist -> telemetry）
    saga: false
    nodes:
      - id: step_guard
        operator: platform.governance.guard
        inputs:
          action: $inputs.action
          payload: $inputs.payload
      - id: step_persist
        operator: platform.governance.persist
        inputs:
          action: $nodes.step_guard.action
          payload: $nodes.step_guard.payload
      - id: step_telemetry
        operator: platform.governance.telemetry.incr
        inputs:
          action: $nodes.step_guard.action
    edges:
      - [step_guard, step_persist]
      - [step_persist, step_telemetry]
