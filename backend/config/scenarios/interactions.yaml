# 统一互动（点赞/收藏/喜欢/踩/评分/评论）业务编排资产
# 业务 = 算子编排；算子只做单件事，业务规则由本文件声明。
#
# 迁移说明（算子内核 v2）：
# * 计数（like/favorite/love/comment/dislike/rating）由纯函数增量计算，
#   写入 `interaction.stat`（复合键 target_type + target_id），不再由 service 隐式维护。
# * 互动记录/评分/评论分别是 `interaction.record`、`interaction.rating`、`content.comment`
#   实体；取消点赞 = 删除记录行，重复评分 = upsert 覆盖。
# * 跨域计数回写：`calc.interaction.target` 产出 {entity, key, patch}，
#   由 `entity.patch` 以动态实体名回写 product/policy/demand/forum/perk 等目标；
#   目标实体未迁移（SOP）或不存在时 `found=false`，回写节点被 when 跳过，不影响主流程。
# * 积分联动属于 loyalty 域，本文件不 import、不编排，由上层场景组合处理。

scenarios:
  # -------------------------------------------------------------------------
  # 互动切换：LIKE / FAVORITE / LOVE / DISLIKE
  # -------------------------------------------------------------------------
  - scenario: OPC_INTERACTION_TOGGLE_PIPELINE
    version: v1.0.0
    domain: interactions
    description: 统一切换公开内容互动（点赞/收藏/喜欢/踩），增量维护计数并回写目标实体
    saga: false
    nodes:
      - id: auth
        operator: guard.authn
      # calc.interaction.toggle 第一次调用只做请求归一化（target_type/kind/user_id），
      # 结果供后续 entity.get 使用；第二次调用才做真正的切换决策。
      - id: request
        operator: calc.interaction.toggle
        inputs:
          target_type: $inputs.target_type
          target_id: $inputs.target_id
          kind: $inputs.kind
          user_id: $context.user_id
      - id: stat
        operator: entity.get
        params: {entity: interaction.stat, required: false}
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
      - id: target
        operator: calc.interaction.target
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.stat.entity
      - id: record
        operator: entity.get
        params: {entity: interaction.record, required: false}
        inputs:
          user_id: $nodes.request.user_id
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          kind: $nodes.request.kind
      - id: rating
        operator: entity.get
        params: {entity: interaction.rating, required: false}
        inputs:
          user_id: $nodes.request.user_id
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
      # 目标实体可能未迁移或已删除：required=false，存在性由下面的 check 统一裁决。
      - id: target_load
        operator: entity.get
        params: {entity: $nodes.target.entity, required: false}
        when: nodes.target.exists
        inputs:
          key: $nodes.target.key.id
      - id: seed
        operator: calc.interaction.target
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.stat.entity
          target: $nodes.target_load.entity
      - id: decision
        operator: calc.interaction.toggle
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          kind: $nodes.request.kind
          user_id: $nodes.request.user_id
          target_title: $inputs.target_title
          target: $nodes.target_load.entity
          existing: $nodes.record.entity
          counts: $nodes.seed.counts
      - id: check
        operator: validate.expression
        params:
          conditions:
            - expr: "not args.exists or args.found"
              message: 互动目标不存在或已被删除
        inputs:
          exists: $nodes.target.exists
          found: $nodes.target_load.found
      - id: create_record
        operator: entity.create
        params: {entity: interaction.record}
        when: nodes.decision.active
        inputs:
          data: $nodes.decision.record
      - id: delete_record
        operator: entity.delete
        params: {entity: interaction.record}
        when: "not nodes.decision.active"
        inputs:
          user_id: $nodes.decision.user_id
          target_type: $nodes.decision.target_type
          target_id: $nodes.decision.target_id
          kind: $nodes.decision.kind
      - id: save_stat
        operator: entity.upsert
        params: {entity: interaction.stat}
        inputs:
          data: $nodes.decision.stat
      - id: records
        operator: entity.list
        params: {entity: interaction.record}
        inputs:
          filters:
            user_id: $nodes.request.user_id
            target_type: $nodes.request.target_type
            target_id: $nodes.request.target_id
      - id: comments
        operator: entity.list
        params: {entity: content.comment}
        inputs:
          filters:
            target_type: $nodes.request.target_type
            target_id: $nodes.request.target_id
            author_id: $nodes.request.user_id
      - id: state
        operator: calc.interaction.state
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.decision.counts
          records: $nodes.records.items
          comments: $nodes.comments.items
          rating: $nodes.rating.entity
          viewer_id: $nodes.request.user_id
      - id: backfill
        operator: calc.interaction.target
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.decision.counts
          target: $nodes.target_load.entity
      - id: write_target
        operator: entity.patch
        params: {entity: $nodes.backfill.entity}
        when: nodes.backfill.found
        inputs:
          data: $nodes.backfill.patch
      - id: metric
        operator: metric.incr
        params: {metric: interaction.toggled}
      - id: result
        operator: transform.merge
        params:
          items:
            - $nodes.state
            - kind: $nodes.decision.kind
              active: $nodes.decision.active
              count: $nodes.decision.count
      - id: response
        operator: transform.derive
        params: {expr: "args.data", output_key: response}
        inputs:
          data: $nodes.result
    edges:
      - [auth, request]
      - [request, stat]
      - [request, target]
      - [request, record]
      - [request, rating]
      - [request, comments]
      - [target, target_load]
      - [stat, seed]
      - [target_load, seed]
      - [record, decision]
      - [seed, decision]
      - [target, check]
      - [target_load, check]
      - [check, create_record]
      - [decision, create_record]
      - [check, delete_record]
      - [decision, delete_record]
      - [decision, save_stat]
      - [create_record, save_stat]
      - [delete_record, save_stat]
      - [create_record, records]
      - [delete_record, records]
      - [records, state]
      - [comments, state]
      - [rating, state]
      - [decision, state]
      - [decision, backfill]
      - [target_load, backfill]
      - [backfill, write_target]
      - [write_target, metric]
      - [save_stat, metric]
      - [state, result]
      - [decision, result]
      - [result, response]
      - [metric, response]

  # -------------------------------------------------------------------------
  # 1-5 星评分
  # -------------------------------------------------------------------------
  - scenario: OPC_INTERACTION_RATE_PIPELINE
    version: v1.0.0
    domain: interactions
    description: 对公开内容提交/更新 1-5 星评分（覆盖而非重复计数）
    saga: false
    nodes:
      - id: auth
        operator: guard.authn
      - id: request
        operator: calc.interaction.target
        inputs:
          target_type: $inputs.target_type
          target_id: $inputs.target_id
      - id: stat
        operator: entity.get
        params: {entity: interaction.stat, required: false}
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
      - id: rating_load
        operator: entity.get
        params: {entity: interaction.rating, required: false}
        inputs:
          user_id: $context.user_id
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
      - id: target_load
        operator: entity.get
        params: {entity: $nodes.request.entity, required: false}
        when: nodes.request.exists
        inputs:
          key: $nodes.request.key.id
      - id: seed
        operator: calc.interaction.target
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.stat.entity
          target: $nodes.target_load.entity
      - id: check
        operator: validate.expression
        params:
          conditions:
            - expr: "not args.exists or args.found"
              message: 评分目标不存在或已被删除
        inputs:
          exists: $nodes.request.exists
          found: $nodes.target_load.found
      - id: rating
        operator: calc.interaction.rating
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          user_id: $context.user_id
          score: $inputs.score
          counts: $nodes.seed.counts
          previous: $nodes.rating_load.entity.score
      - id: save_rating
        operator: entity.upsert
        params: {entity: interaction.rating}
        inputs:
          data: $nodes.rating.rating
      - id: save_stat
        operator: entity.upsert
        params: {entity: interaction.stat}
        inputs:
          data: $nodes.rating.stat
      - id: records
        operator: entity.list
        params: {entity: interaction.record}
        inputs:
          filters:
            user_id: $context.user_id
            target_type: $nodes.request.target_type
            target_id: $nodes.request.target_id
      - id: comments
        operator: entity.list
        params: {entity: content.comment}
        inputs:
          filters:
            target_type: $nodes.request.target_type
            target_id: $nodes.request.target_id
            author_id: $context.user_id
      - id: state
        operator: calc.interaction.state
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.rating.counts
          records: $nodes.records.items
          comments: $nodes.comments.items
          rating: $nodes.save_rating.entity
          viewer_id: $context.user_id
      - id: backfill
        operator: calc.interaction.target
        inputs:
          target_type: $nodes.request.target_type
          target_id: $nodes.request.target_id
          counts: $nodes.rating.counts
          target: $nodes.target_load.entity
      - id: write_target
        operator: entity.patch
        params: {entity: $nodes.backfill.entity}
        when: nodes.backfill.found
        inputs:
          data: $nodes.backfill.patch
      - id: metric
        operator: metric.incr
        params: {metric: interaction.rated}
      - id: response
        operator: transform.derive
        params: {expr: "args.data", output_key: response}
        inputs:
          data: $nodes.state
    edges:
      - [auth, request]
      - [request, stat]
      - [request, rating_load]
      - [request, target_load]
      - [request, records]
      - [request, comments]
      - [stat, seed]
      - [target_load, seed]
      - [request, check]
      - [target_load, check]
      - [seed, rating]
      - [rating_load, rating]
      - [check, save_rating]
      - [rating, save_rating]
      - [save_rating, save_stat]
      - [save_rating, state]
      - [records, state]
      - [comments, state]
      - [save_stat, backfill]
      - [target_load, backfill]
      - [backfill, write_target]
      - [write_target, metric]
      - [save_stat, metric]
      - [state, response]
      - [metric, response]

